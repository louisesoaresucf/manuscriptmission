<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e4c3">
  <title>Manuscript Mission</title>
  <meta name="description" content="A witch's spell has scattered a medieval library. Find the escaped creatures, elements and plants and return them to their manuscripts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section class="title-screen" id="screen-title">
      <h1>Manuscript Mission</h1>
      <div class="books" id="title-books"></div>
      <p><span class="initial">A</span> wicked witch has cast a spell upon the great library! Every book has tumbled from its shelf, and the creatures, elements and plants painted inside have escaped. Find them and return each one to its manuscript.</p>
      <button class="btn" id="btn-begin" type="button">Begin</button>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
